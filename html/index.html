/* =========================
   UTILS
========================= */
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function makeCycler(list){
  let arr = list.slice();
  shuffle(arr);
  let idx = 0;
  return function next(){
    if(arr.length === 0) return null;
    if(idx >= arr.length){
      shuffle(arr);
      idx = 0;
    }
    return arr[idx++];
  };
}

/**
 * Pattern per 2 TEMPORALI per blocco (U/D):
 * In 16 blocchi, con k=2 => UU=2, DD=2, UD=6, DU=6 (usa 16U e 16D esatti).
 * Vincolo: evita 3 pattern identici di fila (se possibile)
 */
function buildTemporalPairPatterns(blockCount, k=2){
  const patterns = [];
  for(let i=0;i<k;i++) patterns.push(["U","U"]);
  for(let i=0;i<k;i++) patterns.push(["D","D"]);

  const rest = blockCount - 2*k;
  const half = Math.floor(rest/2);
  for(let i=0;i<half;i++) patterns.push(["U","D"]);
  for(let i=0;i<half;i++) patterns.push(["D","U"]);
  while(patterns.length < blockCount) patterns.push(["U","D"]); // fallback

  let tries = 160;
  while(tries--){
    const p = patterns.slice();
    shuffle(p);
    let ok = true;
    for(let i=2;i<p.length;i++){
      const a = p[i].join("");
      const b = p[i-1].join("");
      const c = p[i-2].join("");
      if(a===b && b===c){ ok=false; break; }
    }
    if(ok) return p;
  }
  shuffle(patterns);
  return patterns;
}

/**
 * Pattern binario per condizionali lungo i blocchi:
 * es. 8 "R" + 8 "N" in 16 blocchi, sparsi
 * Vincolo: evita 3 uguali di fila (se possibile)
 */
function buildBinaryPatterns(blockCount, nA, labelA, labelB){
  const arr = [];
  for(let i=0;i<nA;i++) arr.push(labelA);
  for(let i=nA;i<blockCount;i++) arr.push(labelB);

  let tries = 200;
  while(tries--){
    const p = arr.slice();
    shuffle(p);
    let ok = true;
    for(let i=2;i<p.length;i++){
      if(p[i]===p[i-1] && p[i-1]===p[i-2]) { ok=false; break; }
    }
    if(ok) return p;
  }
  shuffle(arr);
  return arr;
}

/**
 * Chiave immagine: stesse immagini per causali/causative/passive/interrogative negative
 * con lo stesso numero. Per le altre categorie restituisce null.
 */
function chiaveImmagine(file){
  const m = /^Frase (causale|causativa|passiva|interrogativa negativa) (\d+)\.html$/.exec(file || "");
  return m ? "img" + m[2] : null;
}

/**
 * Per ogni lista (una per categoria) sceglie un ordine casuale lungo blockCount
 * tale che, in ogni blocco, nessuna immagine compaia in piu' di una categoria.
 * Ogni file viene usato una sola volta.
 */
function buildImageSafeOrders(lists, blockCount){
  const risultati = [];
  const usate = Array.from({length: blockCount}, () => new Set());

  for(const list of lists){
    let scelta = null;
    for(let t=0; t<20000 && !scelta; t++){
      const p = shuffle(list.slice()).slice(0, blockCount);
      if(!EVITA_STESSA_IMMAGINE || p.every((f,b) => !usate[b].has(chiaveImmagine(f)))) scelta = p;
    }
    if(!scelta) scelta = shuffle(list.slice()).slice(0, blockCount); // fallback (non dovrebbe servire)

    scelta.forEach((f,b) => { const k = chiaveImmagine(f); if(k) usate[b].add(k); });
    risultati.push(scelta);
  }
  return risultati;
}

/**
 * Shuffle con vincoli (per ogni blocco):
 * - evita stessa categoria adiacente (se possibile)
 * - le TEMPORALI non devono essere consecutive
 * - evita che il primo del blocco ripeta la categoria dell'ultimo globale (se possibile)
 * - evita che il primo del blocco abbia la stessa immagine dell'ultimo globale
 */
function arrangeWithConstraints(items, lastCatGlobal, lastImgGlobal){
  let tries = 260;
  while(tries--){
    const a = items.slice();
    shuffle(a);

    if(lastCatGlobal && a[0]?.cat === lastCatGlobal) continue;
    if(EVITA_STESSA_IMMAGINE && lastImgGlobal && chiaveImmagine(a[0]?.file) === lastImgGlobal) continue;

    let ok = true;
    for(let i=1;i<a.length;i++){
      if(a[i].cat === a[i-1].cat){ ok=false; break; }
      if(a[i].cat === "temporale" && a[i-1].cat === "temporale"){ ok=false; break; }
    }
    if(ok) return a;
  }

  // fallback: shuffle semplice + swap per evitare temporali consecutive
  const a = items.slice();
  shuffle(a);
  for(let i=1;i<a.length;i++){
    if(a[i].cat === "temporale" && a[i-1].cat === "temporale"){
      for(let j=i+1;j<a.length;j++){
        if(a[j].cat !== "temporale"){
          const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
          break;
        }
      }
    }
  }
  return a;
}

/* =========================
   COSTRUZIONE PROVA VERA A BLOCCHI
========================= */
function buildSequenceByBlocks(blockCount){
  // temporali
  const nextTempU = makeCycler(temporaliUguale);
  const nextTempD = makeCycler(temporaliDiverso);
  const tempPatterns = buildTemporalPairPatterns(blockCount, /*k=*/2);

  // condizionali: pattern per blocco (8R + 8N) e pescaggio da due mazzi
  const r = condRispettata.slice(); shuffle(r);
  const n = condNonRispettata.slice(); shuffle(n);
  const condPattern = buildBinaryPatterns(blockCount, Math.floor(blockCount/2), "R", "N");

  // altre categorie
  // ✅ le 4 categorie con video condividono le immagini: ordini costruiti insieme
  const [ordCaus, ordPass, ordIntN, ordCausat] = buildImageSafeOrders(
    [causali, passive, interrogativeNegative, causative], blockCount
  );
  const nextFin    = makeCycler(finali);

  const seq = [];
  let lastCatGlobal = null;
  let lastImgGlobal = null;

  for(let b=0;b<blockCount;b++){
    const blockItems = [];

    // 2 temporali
    const pat = tempPatterns[b];
    const t1 = (pat[0]==="U") ? nextTempU() : nextTempD();
    const t2 = (pat[1]==="U") ? nextTempU() : nextTempD();
    blockItems.push({ file: t1, cat:"temporale" });
    blockItems.push({ file: t2, cat:"temporale" });

    // 1 condizionale per blocco
    const whichCond = condPattern[b];
    const condFile = (whichCond==="R") ? (r.pop() ?? null) : (n.pop() ?? null);
    blockItems.push({ file: condFile, cat:"condizionale" });

    // 1 per ciascuna altra categoria
    blockItems.push({ file: ordCaus[b],   cat:"causale" });
    blockItems.push({ file: ordPass[b],   cat:"passiva" });
    blockItems.push({ file: nextFin(),    cat:"finale" });
    blockItems.push({ file: ordIntN[b],   cat:"interrogativa_negativa" });
    blockItems.push({ file: ordCausat[b], cat:"causativa" });

    const clean = blockItems.filter(x => x.file);
    const arranged = arrangeWithConstraints(clean, lastCatGlobal, lastImgGlobal);

    for(const it of arranged) seq.push(it.file);
    lastCatGlobal = arranged[arranged.length-1]?.cat ?? lastCatGlobal;
    lastImgGlobal = chiaveImmagine(arranged[arranged.length-1]?.file);
  }

  return seq;
}

/* =========================
   ✅ CONTENITORE + AUDIO (iPad)
   Safari su iPad fa partire l'audio da solo solo se la pagina ha ricevuto un tocco.
   Per questo l'index resta sempre aperto: le frasi si aprono dentro frameFrase
   e l'audio viene suonato dall'index, "sbloccato" dal primo tocco su un pulsante.
========================= */
const frameEl = document.getElementById("frameFrase");
let ctxAudio = null;
const bufferAudio = {};
let sorgenteCorrente = null;

function sbloccaAudio(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    if(!ctxAudio) ctxAudio = new AC();
    if(ctxAudio.state !== "running") ctxAudio.resume();
    // suono muto: su iPad serve per sbloccare l'audio
    const b = ctxAudio.createBuffer(1, 1, 22050);
    const s = ctxAudio.createBufferSource();
    s.buffer = b; s.connect(ctxAudio.destination); s.start(0);
  }catch(e){}
}

function decodifica(arrayBuffer){
  return new Promise((ok, ko) => ctxAudio.decodeAudioData(arrayBuffer, ok, ko));
}

// chiamata dalle pagine delle frasi: suona la frase e avvisa quando parte davvero
window.suonaFrase = async function(url, cb){
  if(!ctxAudio || ctxAudio.state !== "running") throw new Error("audio non sbloccato");
  let buf = bufferAudio[url];
  if(!buf){
    const resp = await fetch(url);
    if(!resp.ok) throw new Error("audio non trovato: " + url);
    buf = await decodifica(await resp.arrayBuffer());
    bufferAudio[url] = buf;
  }
  if(ctxAudio.state !== "running") throw new Error("audio sospeso");
  const src = ctxAudio.createBufferSource();
  src.buffer = buf;
  src.connect(ctxAudio.destination);
  src.onended = () => { if(sorgenteCorrente === src) sorgenteCorrente = null; if(cb && cb.onEnd) cb.onEnd(); };
  if(sorgenteCorrente){ try{ sorgenteCorrente.stop(); }catch(e){} }
  sorgenteCorrente = src;
  src.start(0);
  if(cb && cb.onStart) cb.onStart(buf.duration);
};

function apriFrase(file){
  frameEl.src = file;
  frameEl.style.display = "block";
}

function chiudiFrase(){
  // se si passa alla frase successiva mentre l'audio suona, lo ferma
  if(sorgenteCorrente){ try{ sorgenteCorrente.stop(); }catch(e){} sorgenteCorrente = null; }
  frameEl.style.display = "none";
  frameEl.src = "about:blank";
}

// chiamata dalle pagine delle frasi quando si preme "Prossima frase"

function setTitle(t){ titleEl.textContent = t; }

function resetUI(){
  if(timer){ clearInterval(timer); timer=null; }
  if(timeoutFinePre){ clearTimeout(timeoutFinePre); timeoutFinePre=null; }

  setupBoxEl.style.display="none";
  setupErrorEl.style.display="none";
  boxEl.style.display="none";
  progressEl.style.display="none";
  audioEl.pause();
  btn.style.display="inline-block";
  btn.disabled=false;
  btn.onclick=null;
}

/* =========================
   RESET SESSIONE
========================= */
function resetSession(){
  localStorage.removeItem("risposte_sessione");
  localStorage.removeItem("risposte_preliminare_sessione");
  sessionStorage.clear();

  const preSeq = shuffle(eserciziPreliminari.slice());
  sessionStorage.setItem(K.pre_seq, JSON.stringify(preSeq));

  sessionStorage.setItem(K.fase,"pre_start");
}

/* =========================
   SETUP PARTECIPANTE
========================= */
function renderSetup(){
  resetUI();
  sessionStorage.setItem(K.fase,"setup");
  setTitle("Dati partecipante");

  setupBoxEl.style.display="block";

  btn.textContent="Continua";
  btn.onclick=()=>{
    sbloccaAudio();
    const numero = numPartecipanteEl.value.trim();
    const gruppoEl = document.querySelector('input[name="gruppo"]:checked');
    const gruppo = gruppoEl ? gruppoEl.value : null;
    const sessoEl = document.querySelector('input[name="sesso"]:checked');
    const sesso = sessoEl ? sessoEl.value : null;
    const eta = etaEl.value.trim();
    const scolarita = scolaritaEl.value.trim();

    if(!numero || !gruppo || !sesso || !eta || !scolarita){
      setupErrorEl.textContent = "Compila tutti i campi prima di continuare.";
      setupErrorEl.style.display="block";
      return;
    }

    localStorage.setItem(LK.numPartecipante, numero);
    localStorage.setItem(LK.gruppo, gruppo);
    localStorage.setItem(LK.sesso, sesso);
    localStorage.setItem(LK.eta, eta);
    localStorage.setItem(LK.scolarita, scolarita);

    resetSession();
    renderPreStart();
  };
}

/* =========================
   PRE START
========================= */
function renderPreStart(){
  resetUI();
  setTitle("Types of Token");

  boxEl.style.display="flex";
  boxTextEl.textContent =
    "In questo test vedrai degli oggetti di forme e colore diversi. " +
    "In alcune prove vedrai anche un breve video.\n\n" +
    "Per ogni prova ascolterai una frase. Ascolta attentamente la frase " +
    "ed esegui l'azione richiesta utilizzando gli oggetti.\n\n" +
    "In alcune prove non dovrai eseguire alcuna azione.\n\n" +
    "Premi \"Inizia\" per accedere alla prova preliminare.";

  playAudioBtn.onclick = ()=>{
    audioEl.currentTime = 0;
    audioEl.play().catch(()=>{});
  };

  btn.textContent="Inizia";
  btn.onclick=()=>{
    sbloccaAudio();
    sessionStorage.setItem(K.fase,"pre_ready");
    renderPreReady();
  };
}

/* =========================
   PRE READY (schermata intermedia)
========================= */
function renderPreReady(){
  resetUI();
  setTitle("Prova preliminare");
  btn.textContent="Inizia";
  btn.onclick=()=>{
    sbloccaAudio();
    sessionStorage.setItem(K.pre_i,"0");
    sessionStorage.setItem(K.fase,"pre_run");
    runPre();
  };
}
/* =========================
   PRE RUN
========================= */
function runPre(){
  const seq = JSON.parse(sessionStorage.getItem(K.pre_seq) || "[]");
  const i = parseInt(sessionStorage.getItem(K.pre_i)||"0",10);

  if(i>=seq.length){
    sessionStorage.setItem(K.fase,"pre_end");
    renderPreEnd();
    return;
  }

  sessionStorage.setItem(K.pre_i,String(i+1));
  apriFrase(seq[i]);
}

/* =========================
   PRE END
========================= */
function renderPreEnd(){
  resetUI();
  setTitle("Fine prova preliminare");
  btn.style.display="none";

  timeoutFinePre = setTimeout(()=>{
    const seq = buildSequenceByBlocks(16);

    sessionStorage.setItem(K.seq, JSON.stringify(seq));
    sessionStorage.setItem(K.idx, "0");
    sessionStorage.setItem(K.pausa, "false");
    sessionStorage.setItem(K.fase, "test_intro");
    renderTestIntro();
  }, ATTESA_FINE_PRELIM_MS);
}

/* =========================
   TEST INTRO
========================= */
function renderTestIntro(){
  resetUI();
  setTitle("Types of Token");
  btn.textContent="Inizia";
  btn.onclick=()=>{
    sbloccaAudio();
    sessionStorage.setItem(K.fase,"test");
    runTest();
  };
}

/* =========================
   PAUSA
========================= */
function renderPausa(){
  resetUI();
  setTitle("Pausa");

  progressEl.style.display="block";
  btn.style.display="none";

  // ✅ se la pagina viene ricaricata durante la pausa, il conto alla rovescia continua
  const fineSalvata = parseInt(sessionStorage.getItem(K.fine) || "0", 10);
  const fine = fineSalvata > 0 ? fineSalvata : Date.now() + DURATA_PAUSA_SEC*1000;
  sessionStorage.setItem(K.fine, String(fine));
  progressEl.textContent = `${Math.max(0, Math.ceil((fine - Date.now())/1000))} s`;

  timer = setInterval(()=>{
    const rest = Math.max(0, Math.ceil((fine - Date.now())/1000));
    progressEl.textContent = `${rest} s`;

    if(rest <= 0){
      clearInterval(timer);
      timer = null;

      setTitle("Fine pausa");
      progressEl.textContent = "";

      btn.style.display="inline-block";
      btn.textContent = "Riprendi prova";
      btn.onclick = ()=>{
        sbloccaAudio();
        sessionStorage.setItem(K.pausa, "true");
        sessionStorage.setItem(K.fase, "test");
        runTest();
      };
    }
  }, 300);
}

/* =========================
   TEST
========================= */
function runTest(){
  const seq = JSON.parse(sessionStorage.getItem(K.seq)||"[]");
  const idx = parseInt(sessionStorage.getItem(K.idx)||"0",10);

  if(seq.length===0 || idx>=seq.length){
    sessionStorage.setItem(K.fase,"test_end");
    renderTestEnd();
    return;
  }

  const metà = Math.floor(seq.length/2);
  if(sessionStorage.getItem(K.pausa)!=="true" && idx>=metà){
    sessionStorage.setItem(K.fase,"pause");
    renderPausa();
    return;
  }

  sessionStorage.setItem(K.idx,String(idx+1));
  apriFrase(seq[idx]);
}

/* =========================
   TEST END
========================= */
function renderTestEnd(){
  resetUI();
  setTitle("Fine prova");
  btn.textContent="Vedi risposte";
  btn.onclick=()=>location.href="risposte.html";
}

/* =========================
   RIPRESA DOPO RICARICAMENTO
   (serve un tocco per sbloccare di nuovo l'audio)
========================= */
function renderRiprendi(){
  resetUI();
  setTitle("Types of Token");
  btn.textContent="Riprendi";
  btn.onclick=()=>{
    sbloccaAudio();
    continua();
  };
}

/* =========================
   START
========================= */
function continua(){
  const fase = sessionStorage.getItem(K.fase);

  if(!fase){
    localStorage.removeItem(LK.numPartecipante);
    localStorage.removeItem(LK.gruppo);
    localStorage.removeItem(LK.sesso);
    localStorage.removeItem(LK.eta);
    localStorage.removeItem(LK.scolarita);
    renderSetup();
    return;
  }

  if(fase==="setup") renderSetup();
  else if(fase==="pre_start") renderPreStart();
  else if(fase==="pre_ready") renderPreReady();
  else if(fase==="pre_run") runPre();
  else if(fase==="pre_end") renderPreEnd();
  else if(fase==="test_intro") renderTestIntro();
  else if(fase==="test") runTest();
  else if(fase==="pause") renderPausa();
  else if(fase==="test_end") renderTestEnd();
  else {
    resetSession();
    renderPreStart();
  }
}

(function(){
  const fase = sessionStorage.getItem(K.fase);
  // se la pagina viene ricaricata durante la prova, un tocco su "Riprendi" riattiva l'audio
  if(fase === "pre_run" || fase === "test") renderRiprendi();
  else continua();
})();
</script>
