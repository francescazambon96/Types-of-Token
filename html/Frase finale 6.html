<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Frase finale 6</title>

  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:white; font-family:sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .wrapper { width:100%; max-width:900px; display:flex; justify-content:center; align-items:center; }
    .screen { width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:15px; padding:10px 0; }
    .media-slot { width:100%; display:flex; justify-content:center; align-items:center; }
    canvas { border:none !important; touch-action:none; max-width:80vw; max-height:80vh; width:auto; height:auto; display:block; }
    .buttons-row{ display:flex; justify-content:center; width:100%; max-width:380px; margin-top:14px; }
    button{ width:100%; padding:11px 22px; font-size:17.5px; border-radius:9px; border:2px solid #333; background:#f2f2f2; cursor:pointer; }
  
    /* IPAD_CSS */
    /* ✅ iPad: niente zoom con doppio tocco, niente menu "Salva immagine" con il tocco lungo,
       niente selezione del testo o riquadro grigio quando si tocca */
    html, body {
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    img, canvas, video {
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
    }
    body { min-height: 100dvh; }   /* altezza reale dello schermo (senza barre di Safari) */
  </style>
</head>

<body>

  <audio id="audioFrase">
    <source src="../audio/Frase finale 6.m4a" type="audio/mp4" />
  </audio>

  <div class="wrapper">
    <div class="screen">
      <div class="media-slot">
        <canvas id="scene"></canvas>
      </div>

      <div class="buttons-row">
        <button id="nextBtn">Prossima frase</button>
      </div>
    </div>
  </div>

<script>
/* CONTENITORE_PATCH */
// ✅ se la frase e' aperta dentro l'index (contenitore), torna all'index senza ricaricarlo
function vaiAllaProssima() {
  try {
    if (window.parent !== window && typeof window.parent.prossimaFrase === "function") {
      window.parent.prossimaFrase();
      return;
    }
  } catch (e) {}
  location.href = "index.html";
}
/* RT_ONSET_PATCH */
/* ASCOLTA_PATCH */
/* RT_PATCH_APPLIED */
  const canvas     = document.getElementById("scene");
  const ctx        = canvas.getContext("2d");
  const nextBtn    = document.getElementById("nextBtn");
  const audioFrase = document.getElementById("audioFrase");

  const WIDTH  = 800;
  const HEIGHT = 500;
  const ratio  = window.devicePixelRatio || 1;

  canvas.width  = WIDTH * ratio;
  canvas.height = HEIGHT * ratio;
  ctx.scale(ratio, ratio);

  /* =======================
     ✅ CONFIG (solo testo umano)
  ======================= */
  const ESERCIZIO  = "Frase finale 6";
  const CATEGORIA  = "Frasi finali";
  const FASE = "prova";
  const INCLUDE_IN_PUNTEGGIO = true;

  // ✅ qui scrivi SOLO parole (come vuoi che venga salvato)
  const MOVER_NAME  = "triangolo rosso";
  const TARGET_NAME = "cerchio giallo";
  const STIMOLO = `Usa il ${MOVER_NAME} per spostare il ${TARGET_NAME}`;

  // Pagina successiva
  const NEXT_HREF = "index.html";

  /* =======================
     MAPPA nomi -> ID (serve solo al codice)
  ======================= */
  const NAME_TO_ID = {
    "triangolo rosso":  "triRed",
    "triangolo verde":   "triGreen",
    "cerchio giallo": "cirYellow",
    "cerchio nero":   "cirBlack"
  };

  const CORRETTO_MOVER  = NAME_TO_ID[MOVER_NAME];
  const CORRETTO_TARGET = NAME_TO_ID[TARGET_NAME];

  /* =======================
     TOKEN: 2x2
  ======================= */
  const TRI_SIZE = 90;
  const CIRC_R   = 45;

  // Layout richiesto:
  // Riga alta:  Triangolo verde (sx)  Triangolo rosso (dx)
  // Riga bassa: Cerchio nero (sx) Cerchio giallo (dx)
  const start = {
    triGreen:    { x:290, y:150 },
    triRed:  { x:510, y:150 },
    cirBlack:  { x:290, y:350 },
    cirYellow: { x:510, y:350 }
  };

  const tokens = [
    { id:"cirYellow",    type:"circle", color:"#FFF000",      x:start.cirYellow.x,    y:start.cirYellow.y,    r:CIRC_R },
    { id:"triRed",  type:"tri",    color:"red",    x:start.triRed.x,  y:start.triRed.y,  size:TRI_SIZE },
    { id:"triGreen",  type:"tri",    color:"green",    x:start.triGreen.x,  y:start.triGreen.y,  size:TRI_SIZE, outline:true },
    { id:"cirBlack", type:"circle", color:"black",  x:start.cirBlack.x, y:start.cirBlack.y, r:CIRC_R }
  ];

  let draggingId = null;

  /* =======================
     ✅ REGISTRAZIONE RISPOSTA
  ======================= */
  let collisionByMover = false;
  let moverWho = null;
  let targetWho = null;

  let anyDrag = false;
  const dragged = { cirYellow:false, triRed:false, triGreen:false, cirBlack:false };

  let tStimoloInizio = null;   // istante in cui finisce l'audio
  let tempoReazioneMs = null;  // tempo di reazione: dal fine audio al primo trascinamento

  const ID_TO_NAME = {
    cirYellow:    "cerchio giallo",
    triRed:  "triangolo rosso",
    triGreen:  "triangolo verde",
    cirBlack: "cerchio nero"
  };
  function nomeToken(id){ return ID_TO_NAME[id] || id; }

  /* ---------------- GEOMETRIA (SAT) ---------------- */
  function triPoly(t){
    const h = t.size / 2;
    const b = t.size * 0.55;
    return [{x:t.x,y:t.y-h},{x:t.x-b,y:t.y+h},{x:t.x+b,y:t.y+h}];
  }
  function circPoly(c, n=18){
    const pts=[];
    for(let i=0;i<n;i++){
      const ang=i/n*Math.PI*2;
      pts.push({x:c.x+Math.cos(ang)*c.r, y:c.y+Math.sin(ang)*c.r});
    }
    return pts;
  }
  function poly(t){ return t.type==="tri" ? triPoly(t) : circPoly(t); }
  function center(t){ return {x:t.x, y:t.y}; }
  function axes(p){
    const a=[];
    for(let i=0;i<p.length;i++){
      const p1=p[i], p2=p[(i+1)%p.length];
      const e={x:p2.x-p1.x, y:p2.y-p1.y};
      let n={x:-e.y, y:e.x};
      const l=Math.hypot(n.x,n.y);
      if(l===0) continue;
      n.x/=l; n.y/=l;
      a.push(n);
    }
    return a;
  }
  function proj(p,a){
    let mn=p[0].x*a.x+p[0].y*a.y, mx=mn;
    for(let i=1;i<p.length;i++){
      const v=p[i].x*a.x+p[i].y*a.y;
      if(v<mn) mn=v;
      if(v>mx) mx=v;
    }
    return {mn,mx};
  }
  function getMTV(polyA, polyB, cA, cB){
    const ax = [...axes(polyA), ...axes(polyB)];
    let smallest = Infinity;
    let best = null;
    for(const n of ax){
      const a = proj(polyA,n);
      const b = proj(polyB,n);
      const overlap = Math.min(a.mx,b.mx) - Math.max(a.mn,b.mn);
      if(overlap<=0) return null;
      if(overlap<smallest){ smallest=overlap; best=n; }
    }
    const dir = (cB.x-cA.x)*best.x + (cB.y-cA.y)*best.y;
    const axis = (dir<0) ? {x:-best.x,y:-best.y} : best;
    return {x:axis.x*smallest, y:axis.y*smallest};
  }

  /* ---------------- DISEGNO ---------------- */
  function drawTriangle(t){
    const h=t.size/2, b=t.size*0.55;
    ctx.beginPath();
    ctx.moveTo(t.x, t.y-h);
    ctx.lineTo(t.x-b, t.y+h);
    ctx.lineTo(t.x+b, t.y+h);
    ctx.closePath();

    ctx.fillStyle = t.color;
    ctx.fill();

    ctx.strokeStyle="black";
    ctx.lineWidth=1/ratio;
    ctx.stroke();
  }
  function drawCircle(c){
    ctx.beginPath();
    ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.closePath();

    ctx.fillStyle = c.outline ? "black" : c.color;
    ctx.fill();

    ctx.strokeStyle="black";
    ctx.lineWidth=1/ratio;
    ctx.stroke();
  }
  function drawScene(){
    ctx.clearRect(0,0,WIDTH,HEIGHT);
    tokens.filter(t=>t.type==="circle").forEach(drawCircle);
    tokens.filter(t=>t.type==="tri").forEach(drawTriangle);
  }

  /* ---------------- HIT TEST ---------------- */
  function insideTriangle(x,y,t){
    const h=t.size/2, b=t.size*0.55;
    const ax=t.x,   ay=t.y-h;
    const bx=t.x-b, by=t.y+h;
    const cx=t.x+b, cy=t.y+h;
    const s = (x1,y1,x2,y2,x3,y3)=> (x1-x3)*(y2-y3)-(x2-x3)*(y1-y3);
    const d1=s(x,y,ax,ay,bx,by), d2=s(x,y,bx,by,cx,cy), d3=s(x,y,cx,cy,ax,ay);
    const hasNeg=(d1<0)||(d2<0)||(d3<0);
    const hasPos=(d1>0)||(d2>0)||(d3>0);
    return !(hasNeg && hasPos);
  }
  function insideCircle(x,y,c){
    const dx=x-c.x, dy=y-c.y;
    return dx*dx+dy*dy <= c.r*c.r;
  }
  function hit(x,y,t){
    return t.type==="tri" ? insideTriangle(x,y,t) : insideCircle(x,y,t);
  }
  function getPos(evt){
    const rect=canvas.getBoundingClientRect();
    const sx=WIDTH/rect.width;
    const sy=HEIGHT/rect.height;
    let clientX, clientY;
    if(evt.touches && evt.touches[0]){ clientX=evt.touches[0].clientX; clientY=evt.touches[0].clientY; }
    else { clientX=evt.clientX; clientY=evt.clientY; }
    return { x:(clientX-rect.left)*sx, y:(clientY-rect.top)*sy };
  }

  /* ---------------- SPINTA QUANDO TOCCA ---------------- */
  function pushOthersFrom(dragId){
    const MAX_PASSES = 12;

    for(let pass=0; pass<MAX_PASSES; pass++){
      let moved=false;
      const A = tokens.find(t=>t.id===dragId);
      if(!A) break;

      for(const B of tokens){
        if(B.id===A.id) continue;
        const mtv = getMTV(poly(A), poly(B), center(A), center(B));
        if(mtv){
          B.x += mtv.x;
          B.y += mtv.y;
          moved = true;

          // ✅ registra la prima spinta come “risposta”
          if(!collisionByMover){
            collisionByMover = true;
            moverWho = A.id;
            targetWho = B.id;
          }
        }
      }

      // propagazione
      for(let i=0;i<tokens.length;i++){
        for(let j=0;j<tokens.length;j++){
          if(i===j) continue;
          const X=tokens[i], Y=tokens[j];
          const mtv2 = getMTV(poly(X), poly(Y), center(X), center(Y));
          if(mtv2){
            Y.x += mtv2.x;
            Y.y += mtv2.y;
            moved = true;
          }
        }
      }

      if(!moved) break;
    }
  }

  /* ---------------- DRAG ---------------- */
  function startDrag(evt){
    evt.preventDefault();
    const p=getPos(evt);

    const order = [
      ...tokens.filter(t=>t.type==="tri"),
      ...tokens.filter(t=>t.type==="circle")
    ];

    draggingId = null;
    for(let i=order.length-1;i>=0;i--){
      const t=order[i];
      if(hit(p.x,p.y,t)){
        // ✅ calcola il tempo di reazione solo al PRIMO trascinamento
        if(!anyDrag){
          if (tAudioInizio != null) {
            tempoDaInizioAudioMs = Math.round(performance.now() - tAudioInizio);
            // dalla FINE della frase (negativo = ha risposto prima che finisse)
            tempoReazioneMs = isFinite(durataFraseSec())
              ? Math.round(tempoDaInizioAudioMs - durataFraseSec() * 1000)
              : null;
          }
        }

        draggingId = t.id;
        anyDrag = true;
        dragged[t.id] = true;
        break;
      }
    }
  }

  function drag(evt){
    if(!draggingId) return;
    evt.preventDefault();

    const p=getPos(evt);
    const t=tokens.find(x=>x.id===draggingId);
    if(!t) return;

    t.x=p.x; t.y=p.y;
    pushOthersFrom(draggingId);
    drawScene();
  }

  function stopDrag(){ draggingId=null; }

  /* ---------------- AUDIO ---------------- */
  function playFrase() {
    audioFrase.currentTime = 0;
    avviaFrase();
  }

  window.onload = () => {
    drawScene();
    playFrase();
  };

  // ✅ RT: il cronometro parte quando l'audio inizia davvero
  let tAudioInizio = null;
  let tempoDaInizioAudioMs = null;
  audioFrase.addEventListener("playing", () => {
    if (tAudioInizio === null) tAudioInizio = performance.now();
  });
  // ✅ iPad: se il browser blocca l'avvio automatico, compare "Ascolta la frase"
  function mostraPulsanteAscolta() {
    if (tAudioInizio !== null || document.getElementById("rigaAscolta")) return;
    const riga = document.createElement("div");
    riga.id = "rigaAscolta";
    riga.className = "buttons-row";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "▶ Ascolta la frase";
    b.addEventListener("click", () => {
      audioFrase.currentTime = 0;
      audioFrase.play().catch(() => {});
    });
    riga.appendChild(b);
    const rigaNext = nextBtn.closest(".buttons-row") || nextBtn.parentElement;
    rigaNext.parentElement.insertBefore(riga, rigaNext);
  }
  audioFrase.addEventListener("playing", () => {
    const r = document.getElementById("rigaAscolta");
    if (r) r.remove();
  });
  // se dopo 2 secondi l'audio non e' ancora partito, mostra comunque il pulsante
  // ✅ iPad: la frase viene suonata dall'index (audio automatico)
  let durataContenitoreSec = null;
  let avvioContenitore = false;
  function durataFraseSec() {
    return durataContenitoreSec != null ? durataContenitoreSec : audioFrase.duration;
  }
  function avviaFrase() {
    let P = null;
    try { if (window.parent !== window && typeof window.parent.suonaFrase === "function") P = window.parent; } catch (e) {}
    if (!P) { audioFrase.play().catch(() => mostraPulsanteAscolta()); return; }
    avvioContenitore = true;
    const sorgente = audioFrase.querySelector("source");
    const url = (sorgente && sorgente.src) || audioFrase.src;
    P.suonaFrase(url, {
      onStart: (durata) => {
        durataContenitoreSec = durata;
        if (tAudioInizio === null) tAudioInizio = performance.now();
        const r = document.getElementById("rigaAscolta");
        if (r) r.remove();
      }
    }).catch(() => { avvioContenitore = false; mostraPulsanteAscolta(); });
  }
  // se dopo 2 secondi l'audio non e' partito (e non sta caricando dall'index), mostra il pulsante
  window.addEventListener("load", () => setTimeout(() => { if (!avvioContenitore) mostraPulsanteAscolta(); }, 2000));

  /* ---------------- SALVATAGGIO ---------------- */
  function salvaRispostaTerapeuta(dati) {
    const key = "risposte_sessione";
    const esistenti = JSON.parse(localStorage.getItem(key) || "[]");

    const risposta = {
      esercizio: dati.esercizio || ESERCIZIO,
      categoria: dati.categoria || CATEGORIA,
      stimolo:   dati.stimolo   || STIMOLO,
      fase: FASE,
      include_in_punteggio: INCLUDE_IN_PUNTEGGIO,
      ha_risposto: dati.ha_risposto,
      risposta_grezza: dati.risposta_grezza,
      descrizione_risposta: dati.descrizione_risposta,
      corretta: dati.corretta,
      punteggio: dati.punteggio,
      ripetizioni_audio: 0,
      tempo_reazione_ms: dati.tempo_reazione_ms,   // dalla fine audio (negativo = anticipato)
      tempo_da_inizio_audio_ms: tempoDaInizioAudioMs,
      durata_audio_ms: isFinite(durataFraseSec()) ? Math.round(durataFraseSec() * 1000) : null,
      audio_partito: tAudioInizio !== null,
      timestamp: new Date().toISOString()
    };

    esistenti.push(risposta);
    localStorage.setItem(key, JSON.stringify(esistenti));
  }

  function valutaESalva() {
    let corretta        = false;
    let punteggio       = 0;
    let rispostaGrezza  = "";
    let descrizioneResp = "";
    let haRispostoFlag  = anyDrag;

    if (!anyDrag) {
      corretta        = null;
      punteggio       = 0;
      rispostaGrezza  = "nessun movimento";
      descrizioneResp = "Non ha mosso nessun gettone";
    }
    else if (collisionByMover) {
      rispostaGrezza  = `${nomeToken(moverWho)} sposta ${nomeToken(targetWho)}`;
      descrizioneResp = `Ha usato il ${nomeToken(moverWho)} per spostare il ${nomeToken(targetWho)}`;

      if (moverWho === CORRETTO_MOVER && targetWho === CORRETTO_TARGET) {
        corretta  = true;
        punteggio = 1;
      } else {
        corretta  = false;
        punteggio = 0;
      }
    }
    else {
      corretta        = false;
      punteggio       = 0;
      rispostaGrezza  = "movimento senza spinta";
      descrizioneResp = "Ha spostato un gettone senza far spostare gli altri";
    }

    salvaRispostaTerapeuta({
      esercizio: ESERCIZIO,
      categoria: CATEGORIA,
      stimolo: STIMOLO,
      ha_risposto: haRispostoFlag,
      risposta_grezza: rispostaGrezza,
      descrizione_risposta: descrizioneResp,
      corretta: corretta,
      punteggio: punteggio,
      ripetizioni_audio: 0,
      tempo_reazione_ms: tempoReazioneMs
    });
  }

  nextBtn.onclick = () => {
    if (nextBtn.disabled) return;
    nextBtn.disabled = true;   // evita doppi salvataggi
    valutaESalva();
    vaiAllaProssima();
  };

  /* ---------------- EVENTI ---------------- */
  canvas.addEventListener("mousedown", startDrag);
  canvas.addEventListener("mousemove", drag);
  window.addEventListener("mouseup", stopDrag);

  canvas.addEventListener("touchstart", startDrag, { passive:false });
  canvas.addEventListener("touchmove",  drag,      { passive:false });
  canvas.addEventListener("touchend",   stopDrag);
  canvas.addEventListener("touchcancel",stopDrag);

  drawScene();
</script>

</body>
</html>
