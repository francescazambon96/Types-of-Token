<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Risposte – Prova</title>

  <style>
    body{
      font-family: sans-serif;
      padding: 20px;
      background: #fafafa;
    }

    h1, h2{ margin-top: 0; }

    .summary{
      margin-bottom: 15px;
      font-size: 15px;
    }

    .partecipante-info{
      margin-bottom: 10px;
      font-size: 15px;
      font-weight: 600;
    }

    table{
      border-collapse: collapse;
      width: 100%;
      margin-top: 15px;
      background: #ffffff;
    }

    th, td{
      border: 1px solid #ccc;
      padding: 6px 8px;
      font-size: 14px;
      text-align: left;
      vertical-align: top;
    }

    th{ background: #eee; }

    .badge{
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      display: inline-block;
    }

    .ok{ background: #c8e6c9; border: 1px solid #388e3c; }
    .no{ background: #ffcdd2; border: 1px solid #c62828; }
    .nr{ background: #fff9c4; border: 1px solid #f9a825; }

    /* ✅ BOTTONI COME PRIMA: orizzontali vicini */
    .controls{
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button{
      padding: 8px 16px;
      font-size: 14px;
      border-radius: 9px;
      border: 2px solid #333;
      background: #f2f2f2;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Risposte sessione – Prova</h1>

  <div class="partecipante-info" id="partecipanteInfo"></div>
  <div class="summary" id="statoSalvataggio" style="font-weight:600"></div>
  <div class="summary" id="totale"></div>
  <div class="category-summary" id="perCategoria"></div>

  <table id="tabella">
    <thead>
      <tr>
        <th>#</th>
        <th>Esercizio</th>
        <th>Categoria</th>
        <th>Stimolo</th>
        <th>Risposta</th>
        <th>Esito</th>
        <th>RT (ms)</th>
        <th>Punti</th>
        <th>Ora</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div class="controls">
    <button onclick="tornaIndex()">Torna all'Index</button>
    <button onclick="cancella()">Cancella risposte</button>
    <button onclick="scaricaCSV()">Scarica di nuovo i risultati</button>
  </div>

<script>
const STORAGE_KEY = "risposte_sessione";
const STORAGE_KEY_PRE = "risposte_preliminare_sessione"; // ✅ per includere la preliminare nel CSV
const LK_NUM = "partecipante_numero";
const LK_GRUPPO = "partecipante_gruppo";
const LK_SESSO = "partecipante_sesso";
const LK_ETA = "partecipante_eta";
const LK_SCOLARITA = "partecipante_scolarita";

const tbody = document.querySelector("#tabella tbody");
const totaleDiv = document.getElementById("totale");
const perCatDiv = document.getElementById("perCategoria");
const partecipanteInfoDiv = document.getElementById("partecipanteInfo");
const statoDiv = document.getElementById("statoSalvataggio");

const risposteRaw = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
const risposte = risposteRaw.filter(r => r.include_in_punteggio !== false);

/* =========================
   DATI PARTECIPANTE
========================= */
function getPartecipanteInfo() {
  const numero = localStorage.getItem(LK_NUM) || "";
  const gruppo = localStorage.getItem(LK_GRUPPO) || "";
  const sesso = localStorage.getItem(LK_SESSO) || "";
  const eta = localStorage.getItem(LK_ETA) || "";
  const scolarita = localStorage.getItem(LK_SCOLARITA) || "";
  return { numero, gruppo, sesso, eta, scolarita };
}

function mostraPartecipanteInfo() {
  const { numero, gruppo, sesso, eta, scolarita } = getPartecipanteInfo();
  const gruppoLabel = gruppo === "afasia" ? "Afasia" : (gruppo === "controllo" ? "Controllo" : "");
  const sessoLabel = sesso === "M" ? "Maschio" : (sesso === "F" ? "Femmina" : "");
  const parti = [];
  if (numero || gruppoLabel) parti.push(`Partecipante: ${numero || "-"} — Gruppo: ${gruppoLabel || "-"}`);
  if (sessoLabel) parti.push(`Sesso: ${sessoLabel}`);
  if (eta) parti.push(`Età: ${eta}`);
  if (scolarita) parti.push(`Scolarità: ${scolarita} anni`);
  partecipanteInfoDiv.textContent = parti.join("  |  ");
}

/* =========================
   ESITO
========================= */
function formatEsito(r) {
  const span = document.createElement("span");
  span.classList.add("badge");

  const isCondNonRispettata =
    r.categoria === "Frasi condizionali" &&
    typeof r.esercizio === "string" &&
    r.esercizio.toLowerCase().includes("condizione non rispettata");

  // ✅ REGOLA SPECIALE
  if (isCondNonRispettata && r.corretta === true) {
    span.textContent = "Corretto";
    span.classList.add("ok");
    return span;
  }

  // ⬇️ comportamento standard
  if (r.ha_risposto === false) {
    span.textContent = "Non risponde";
    span.classList.add("nr");
  } else if (r.corretta === true) {
    span.textContent = "Corretto";
    span.classList.add("ok");
  } else if (r.corretta === false) {
    span.textContent = "Errato";
    span.classList.add("no");
  } else {
    span.textContent = "-";
  }

  return span;
}

/* =========================
   TABELLA
========================= */
function popolaTabella() {
  tbody.innerHTML = "";

  let sommaPunti = 0;
  const stats = {};

  risposte.forEach((r, idx) => {
    const punti = Number(r.punteggio || 0);
    sommaPunti += punti;

    if (!stats[r.categoria]) stats[r.categoria] = { p:0, t:0 };
    stats[r.categoria].p += punti;
    stats[r.categoria].t += 1;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${idx + 1}</td>
      <td>${r.esercizio || ""}</td>
      <td>${r.categoria || ""}</td>
      <td>${r.stimolo || ""}</td>
      <td>${
        r.categoria === "Frasi condizionali" &&
        typeof r.esercizio === "string" &&
        r.esercizio.toLowerCase().includes("condizione non rispettata")
          ? (r.descrizione_risposta || "")
          : (r.ha_risposto ? (r.descrizione_risposta || "") : "")
      }</td>
      <td></td>
      <td>${rtPrincipale(r).ms != null ? rtPrincipale(r).ms + " ms" : "-"}</td>
      <td>${punti}</td>
      <td>${r.timestamp ? new Date(r.timestamp).toLocaleTimeString() : ""}</td>
    `;

    tr.children[5].appendChild(formatEsito(r));
    tbody.appendChild(tr);
  });

  totaleDiv.textContent = `Punteggio totale: ${sommaPunti} / ${risposte.length}`;

  let html = "<h2>Riepilogo per tipo di frase</h2><ul>";
  Object.keys(stats).forEach(c => {
    html += `<li><strong>${c}</strong>: ${stats[c].p} / ${stats[c].t}</li>`;
  });
  html += "</ul>";
  perCatDiv.innerHTML = html;
}

/* =========================
   CONTROLLI
========================= */
function tornaIndex() {
  if (!confirm("Hai salvato il file dei risultati? Tornando all'index le risposte verranno cancellate.")) return;
  localStorage.removeItem(STORAGE_KEY);
  sessionStorage.clear();
  location.href = "index.html";
}

function cancella() {
  if (confirm("Vuoi cancellare tutte le risposte della PROVA?")) {
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
}

/* =========================
   RISULTATI: CSV (prova preliminare + prova) + copia JSON
========================= */

/* =========================
   ✅ RT UNICO
   - frasi con audio: dall'inizio della frase
   - frasi con video: dalla comparsa dell'immagine dopo il video
========================= */
const RE_FRASI_VIDEO = /^Frase (causale|causativa|passiva|interrogativa negativa)\b/i;

function rtPrincipale(r) {
  if (r.tempo_da_inizio_audio_ms != null) return { ms: r.tempo_da_inizio_audio_ms, da: "inizio frase" };
  if (RE_FRASI_VIDEO.test(r.esercizio || "") && r.tempo_reazione_ms != null)
    return { ms: r.tempo_reazione_ms, da: "comparsa immagine" };
  return { ms: null, da: "" };
}

function costruisciRisultati() {
  const preliminari = JSON.parse(localStorage.getItem(STORAGE_KEY_PRE) || "[]");
  const tutte = [
    ...preliminari.map(r => ({ ...r, _fase: r.fase || "prova preliminare" })),
    ...risposte.map(r => ({ ...r, _fase: r.fase || "prova" }))
  ];
  if (!tutte.length) return null;

  const info = getPartecipanteInfo();
  const { numero, gruppo, sesso, eta, scolarita } = info;

  const rows = [["Fase","N","Esercizio","Categoria","Stimolo","Ha_risposto","Risposta","Corretta","Punteggio","RT_ms","RT_misurato_da","Tipo_RT","Durata_audio_ms","Audio_partito","Timestamp","Partecipante","Gruppo","Sesso","Eta","Scolarita"]];
  const contatori = {};
  tutte.forEach(r => {
    contatori[r._fase] = (contatori[r._fase] || 0) + 1;
    rows.push([
      r._fase,
      contatori[r._fase],
      r.esercizio || "",
      r.categoria || "",
      r.stimolo || "",
      r.ha_risposto === true ? "sì" : (r.ha_risposto === false ? "no" : ""),
      (r.descrizione_risposta || r.risposta_grezza || ""),
      r.corretta === true ? "corretto" : (r.corretta === false ? "errato" : ""),
      r.punteggio != null ? r.punteggio : "",
      rtPrincipale(r).ms != null ? rtPrincipale(r).ms : "",
      rtPrincipale(r).da,
      rtPrincipale(r).ms != null ? (r.tipo_rt || "risposta") : "",
      r.durata_audio_ms != null ? r.durata_audio_ms : "",
      r.audio_partito === true ? "sì" : (r.audio_partito === false ? "no" : ""),
      r.timestamp || "",
      numero, gruppo, sesso, eta, scolarita
    ]);
  });

  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(";")).join("\n");

  // copia di sicurezza con TUTTI i dati grezzi (anche dettagli dei tocchi)
  const json = JSON.stringify({
    partecipante: info,
    salvato_il: new Date().toISOString(),
    prova_preliminare: preliminari,
    prova: risposte
  }, null, 2);

  const d = new Date();
  const due = n => String(n).padStart(2, "0");
  const dataOra = `${d.getFullYear()}-${due(d.getMonth()+1)}-${due(d.getDate())}_${due(d.getHours())}${due(d.getMinutes())}`;
  const nomeBase = `risultati${numero ? "_p" + numero : ""}${gruppo ? "_" + gruppo : ""}_${dataOra}`;

  return { nomeBase, csv, json };
}

function mostraStato(testo, ok) {
  statoDiv.textContent = testo;
  statoDiv.style.color = ok ? "#1b5e20" : "#b71c1c";
}

// ✅ download sull'iPad (cartella di download di Safari, es. File > risultati)
function scaricaCSV() {
  const r = costruisciRisultati();
  if (!r) return;
  const blob = new Blob(["\uFEFF" + r.csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = r.nomeBase + ".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

mostraPartecipanteInfo();
popolaTabella();
// ✅ appena si apre la pagina scarica il file (se Safari chiede conferma, tocca "Scarica")
scaricaCSV();
</script>

</body>
</html>
